      draftBadgeIcon = b.icon || null;
      draftBadgeColor = b.color || null;
      draftBadgeShade = (typeof b.shade === 'number') ? b.shade : 4;
      const a = (myProfile && myProfile.address) || null;
      draftAddressLabel = (a && a.label) || '';
      draftAddressGeo = (a && typeof a.lat === 'number') ? { lat: a.lat, lon: a.lon } : null;
      draftStreetAddress = (a && a.street) || '';
      addressSuggestions = [];
      activeBadgeCategory = 'all';
      const t = currentTheme();
      draftThemeMode = t.mode;
      draftThemeSeason = t.season;
      draftThemeMonoFamily = t.monochromeFamily;
      draftThemeDark = t.darkMode;
    } else {
      signinOpen = true;
    }
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  if (isSignInWithEmailLink(auth, window.location.href)) {
    let pendingEmail = window.localStorage.getItem('pp_emailForSignIn');
    if (!pendingEmail) pendingEmail = window.prompt('Confirm your email to finish signing in:');
    if (pendingEmail) {
      signInWithEmailLink(auth, pendingEmail, window.location.href)
        .then(() => {
          window.localStorage.removeItem('pp_emailForSignIn');
          window.history.replaceState({}, document.title, window.location.pathname);
        })
        .catch(() => { setStatus('That sign-in link expired or is invalid — try again.'); });
    }
  }

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      const profRef = doc(db, 'users', user.uid);
      onSnapshot(profRef, (snap) => {
        if (snap.exists()) {
          myProfile = snap.data();
          if (!myProfile.firstName && myProfile.name) {
            myProfile.firstName = myProfile.name;
            myProfile.lastInitial = '';
          }
          if (typeof myProfile.setupComplete !== 'boolean') myProfile.setupComplete = true;
          if (!myProfile.prefs) myProfile.prefs = { defaultGuests: true, defaultBring: true };
          if (typeof myProfile.address === 'string') {
            myProfile.address = myProfile.address ? { label: myProfile.address, lat: null, lon: null } : null;
          }
          if (!Array.isArray(myProfile.ideas)) myProfile.ideas = [];
          if (!myProfile.theme) myProfile.theme = { mode: 'season', season: 'summer', monochromeFamily: 'purple', darkMode: false };
        } else {
          myProfile = {
            firstName: '', lastInitial: '', badge: null, address: null,
            prefs: { defaultGuests: true, defaultBring: true },
            setupComplete: false, ideas: [],
            theme: { mode: 'season', season: 'summer', monochromeFamily: 'purple', darkMode: false }
          };
          setDoc(profRef, myProfile).catch(() => {});
        }
        const label = identityLabel(myProfile);
        if (label) {
          myName = label;
          localStorage.setItem(SAVED_NAME_KEY, myName);
        }
        if (myProfile.setupComplete === false && !profileOpen) {
          profileOpen = true;
          draftBadgeIcon = (myProfile.badge && myProfile.badge.icon) || null;
          draftBadgeColor = (myProfile.badge && myProfile.badge.color) || null;
          draftBadgeShade = (myProfile.badge && typeof myProfile.badge.shade === 'number') ? myProfile.badge.shade : 4;
          draftAddressLabel = (myProfile.address && myProfile.address.label) || '';
          draftAddressGeo = (myProfile.address && typeof myProfile.address.lat === 'number')
            ? { lat: myProfile.address.lat, lon: myProfile.address.lon } : null;
          addressSuggestions = [];
        }
        render();
      });
    } else {
      myProfile = null;
      render();
    }
    renderAvatarButton();
  });

  document.getElementById('pp-fab').addEventListener('click', () => {
    if (activeTab === 'ideas' && currentUser && myProfile) {
      ideaFormOpen = true;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    formOpen = true;
    prefillTitle = '';
    prefillNote = '';
    draftDateSet = new Set();
    draftBringItems = [];
    repeatOn = false;
    pickerMonth = new Date(); pickerMonth.setDate(1);
    activeTab = 'planning';
    ovSelectedDay = null;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.getElementById('pp-help-fab').addEventListener('click', () => {
    helpOpen = true;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.getElementById('pp-nextup').addEventListener('click', () => {
    const ev = nextUpcoming();
    if (!ev) return;
    activeTab = 'locked';
    ovSelectedDay = null;
    scrollToEventId = ev.id;
    render();
  });

  function myAddressGeo() {
    return (myProfile && myProfile.address && typeof myProfile.address.lat === 'number')
      ? myProfile.address : null;
  }

  function weatherIconForDay(iso) {
    const geo = myAddressGeo();
    if (!geo) return '';
    const { locked, candidate } = eventsOnDay(iso);
    if (!locked.length && !candidate.length) return '';
    return weatherIconForCoords(geo.lat, geo.lon, iso);
  }

  function renderCalendarOverview() {
    const cells = daysGridFor(overviewMonth);
    const dow = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    const today = todayIso();
    const geo = myAddressGeo();
    if (geo) {
      cells.forEach(iso => {
        if (!iso) return;
        const { locked, candidate } = eventsOnDay(iso);
        if (locked.length || candidate.length) ensureWeatherForCoords(geo.lat, geo.lon, iso);
      });
    }
    const grid = cells.map(iso => {
      if (!iso) return `<div class="pp-cal-day pp-cal-empty"></div>`;
      const { locked, candidate } = eventsOnDay(iso);
      let cls = 'pp-cal-day';
      let extraStyle = '';
      if (locked.length) cls += ' pp-cal-haslocked';
      else if (candidate.length) { cls += ' pp-cal-hascandidate'; extraStyle = ` style="border: 2px solid ${lightRingFor()};"`; }
      if (iso === today) cls += ' pp-cal-today';
      if (ovSelectedDay === iso) cls += ' pp-cal-daytapped';
      const wIcon = weatherIconForDay(iso);
      const badge = wIcon ? `<span class="pp-cal-weather-badge">${wIcon}</span>` : '';
      return `<button type="button" class="${cls}"${extraStyle} data-ovday="${iso}">${parseInt(iso.slice(8))}${badge}</button>`;
    }).join('');
    let detail = '';
    if (ovSelectedDay) {
      const { locked, candidate } = eventsOnDay(ovSelectedDay);
      if (locked.length || candidate.length) {
        const dayWeather = weatherIconForDay(ovSelectedDay);
        detail = `<div class="pp-ov-detail"><b>${fmtDate(ovSelectedDay)}</b> ${dayWeather}<br/>
          ${locked.map(e => `🔒 <button type="button" class="pp-ov-link" data-ov-goto="locked|${e.id}">${escapeHtml(e.title)}</button> — set`).join('<br/>')}
          ${locked.length && candidate.length ? '<br/>' : ''}
          ${candidate.map(e => `🕓 <button type="button" class="pp-ov-link" data-ov-goto="planning|${e.id}">${escapeHtml(e.title)}</button> — being considered`).join('<br/>')}
        </div>`;
      } else {
        detail = `<div class="pp-ov-detail">Nothing happening on ${fmtDate(ovSelectedDay)}.</div>`;
      }
    }
    return `
      <div class="pp-cal">
        <div class="pp-cal-head">
          <button type="button" class="pp-cal-nav" data-ovnav="-1">‹</button>
          <span>${monthLabel(overviewMonth)}</span>
          <button type="button" class="pp-cal-nav" data-ovnav="1">›</button>
        </div>
        <div class="pp-cal-grid">${dow.map(d => `<div class="pp-cal-dow">${d}</div>`).join('')}${grid}</div>
        <div class="pp-cal-legend"><span><i class="pp-dot pp-dot-pine"></i>Confirmed</span><span><i class="pp-dot pp-dot-gold"></i>Being considered</span></div>
        ${detail}
      </div>`;
  }

  function submitEvent() {
    const title = document.getElementById('pp-f-title').value.trim();
    const location = document.getElementById('pp-f-location').value.trim();
    const note = document.getElementById('pp-f-note').value.trim();
    const dates = [...draftDateSet].sort();
    if (!title || !dates.length) { setStatus('Give it a name and at least one date.'); return; }
    const guestsEnabled = document.getElementById('pp-f-guests').checked;
    const bringEnabled = document.getElementById('pp-f-bring').checked;
    const bring = bringEnabled ? draftBringItems.map(label => ({ id: 'b' + Date.now() + Math.random().toString(36).slice(2, 5), label, claimedBy: null })) : [];
    const locationGeo = (location && location === formDefaultAddress && formDefaultAddressGeo) ? formDefaultAddressGeo : null;
    const ev = { id: 'e' + Date.now() + Math.random().toString(36).slice(2, 6), title, note, location, locationGeo, dates, votes: {}, status: 'open', finalDate: null, plusOnes: {}, bring, guestsEnabled, bringEnabled, createdBy: myName };
    data.events.push(ev);
    formOpen = false;
    draftBringItems = [];
    save(); render();
  }

  function nowStamp() { return new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z'; }
  function statusLabel(status) {
    return status === 'yes' ? "You're going" : status === 'maybe' ? "You're a maybe" : status === 'no' ? "You said no" : 'No reply yet';
  }

  function gcalUrl(ev) {
    const start = ev.finalDate.replace(/-/g, '');
    const endD = new Date(ev.finalDate + 'T00:00:00'); endD.setDate(endD.getDate() + 1);
    const end = endD.toISOString().slice(0, 10).replace(/-/g, '');
    const status = (ev.votes[myName] || {})[ev.finalDate];
    const title = encodeURIComponent(ev.title);
    const details = encodeURIComponent((ev.note ? ev.note + '\n\n' : '') + statusLabel(status) + '\n\nPlanned via Porch Plans.');
    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${details}`;
  }

  function buildIcs(ev) {
    const status = (ev.votes[myName] || {})[ev.finalDate];
    const partstat = status === 'yes' ? 'ACCEPTED' : status === 'maybe' ? 'TENTATIVE' : status === 'no' ? 'DECLINED' : 'NEEDS-ACTION';
    const label = statusLabel(status);
    const start = ev.finalDate.replace(/-/g, '');
    const endD = new Date(ev.finalDate + 'T00:00:00'); endD.setDate(endD.getDate() + 1);
    const end = endD.toISOString().slice(0, 10).replace(/-/g, '');
    const desc = ((ev.note ? ev.note + '\\n\\n' : '') + label).replace(/\n/g, '\\n');
    return [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Porch Plans//EN', 'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      `UID:${ev.id}@porchplans`,
      `DTSTAMP:${nowStamp()}`,
      `DTSTART;VALUE=DATE:${start}`,
      `DTEND;VALUE=DATE:${end}`,
      `SUMMARY:${ev.title}`,
      desc ? `DESCRIPTION:${desc}` : '',
      'STATUS:CONFIRMED',
      `ATTENDEE;PARTSTAT=${partstat};CN=${myName || 'Guest'}:mailto:noreply@example.com`,
      'END:VEVENT', 'END:VCALENDAR'
    ].filter(Boolean).join('\r\n');
  }

  function downloadIcs(ev) {
    const ics = buildIcs(ev);
    const blob = new Blob([ics], { type: 'text/calendar' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = ev.title.replace(/[^a-z0-9]/gi, '_') + '.ics';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function attachHandlers() {
    document.querySelectorAll('[data-idea-edit]').forEach(btn => {
      btn.addEventListener('click', () => {
        editTargetType = 'idea';
        editTargetId = btn.dataset.ideaEdit;
        editFormOpen = true;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    document.querySelectorAll('[data-event-edit]').forEach(btn => {
      btn.addEventListener('click', () => {
        editTargetType = 'event';
        editTargetId = btn.dataset.eventEdit;
        editFormOpen = true;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    document.querySelectorAll('[data-addlocation]').forEach(btn => {
      btn.addEventListener('click', () => {
        editTargetType = 'addlocation';
        editTargetId = btn.dataset.addlocation;
        editFormOpen = true;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    document.querySelectorAll('[data-ov-goto]').forEach(btn => {
      btn.addEventListener('click', () => {
        const [tab, id] = btn.dataset.ovGoto.split('|');
        activeTab = tab;
        ovSelectedDay = null;
        scrollToEventId = id;
        render();
      });
    });
    document.querySelectorAll('[data-idea-del]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Remove this idea?')) return;
        myProfile.ideas = (myProfile.ideas || []).filter(i => i.id !== btn.dataset.ideaDel);
        try { await setDoc(doc(db, 'users', currentUser.uid), myProfile); } catch (e) {}
        render();
      });
    });
    document.querySelectorAll('[data-idea-promote]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const idea = (myProfile.ideas || []).find(i => i.id === btn.dataset.ideaPromote);
        if (!idea) return;
        myProfile.ideas = (myProfile.ideas || []).filter(i => i.id !== idea.id);
        try { await setDoc(doc(db, 'users', currentUser.uid), myProfile); } catch (e) {}
        prefillTitle = idea.title;
        prefillNote = idea.note || '';
        draftDateSet = new Set();
        draftBringItems = [];
        repeatOn = false;
        pickerMonth = new Date(); pickerMonth.setDate(1);
        ovSelectedDay = null;
        activeTab = 'planning';
        formOpen = true;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    document.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => { activeTab = btn.dataset.tab; ovSelectedDay = null; render(); });
    });
    document.querySelectorAll('[data-vote]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!requireName()) return;
        const evId = btn.dataset.event, date = btn.dataset.date, status = btn.dataset.status;
        const ev = data.events.find(e => e.id === evId);
        if (!ev) return;
        ev.votes = ev.votes || {};
        ev.votes[myName] = ev.votes[myName] || {};
        const current = ev.votes[myName][date];
        ev.votes[myName][date] = current === status ? null : status;
        if (!ev.votes[myName][date]) delete ev.votes[myName][date];
        save(); render();
      });
    });
    document.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => { expanded[btn.dataset.toggle] = !expanded[btn.dataset.toggle]; render(); });
    });
    document.querySelectorAll('[data-delevent]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!confirm('Remove this gathering for everyone?')) return;
        data.events = data.events.filter(e => e.id !== btn.dataset.delevent);
        save(); render();
      });
    });
    document.querySelectorAll('[data-moveup]').forEach(btn => { btn.addEventListener('click', () => moveEvent(btn.dataset.moveup, -1)); });
    document.querySelectorAll('[data-movedown]').forEach(btn => { btn.addEventListener('click', () => moveEvent(btn.dataset.movedown, 1)); });
    document.querySelectorAll('[data-final-toggle]').forEach(btn => {
      btn.addEventListener('click', () => { finalizing[btn.dataset.finalToggle] = true; render(); });
    });
    document.querySelectorAll('[data-final-cancel]').forEach(btn => {
      btn.addEventListener('click', () => { delete finalizing[btn.dataset.finalCancel]; render(); });
    });
    document.querySelectorAll('[data-final-confirm]').forEach(btn => {
      btn.addEventListener('click', () => {
        const evId = btn.dataset.finalConfirm;
        const ev = data.events.find(e => e.id === evId);
        const sel = document.getElementById('pp-fsel-' + evId);
        if (!ev || !sel) return;
        const chosen = sel.value;
        const clash = lockedEvents().find(e => e.id !== ev.id && e.finalDate === chosen);
        const msg = clash
          ? `Heads up: "${clash.title}" is already set for ${fmtDate(chosen)}. Set "${ev.title}" for the same day anyway?`
          : `Set ${fmtDate(chosen)} for "${ev.title}"? Everyone will see it as final.`;
        if (!confirm(msg)) return;
        ev.status = 'finalized'; ev.finalDate = chosen;
        delete finalizing[evId];
        save(); render();
      });
    });
    document.querySelectorAll('[data-reopen]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ev = data.events.find(e => e.id === btn.dataset.reopen);
        if (!ev) return;
        if (!confirm(`Reopen "${ev.title}" for voting again?`)) return;
        ev.status = 'open'; ev.finalDate = null;
        save(); render();
      });
    });
    document.querySelectorAll('[data-gcal]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!requireName()) return;
        const ev = data.events.find(e => e.id === btn.dataset.gcal);
        if (ev) window.open(gcalUrl(ev), '_blank');
      });
    });
    document.querySelectorAll('[data-ics]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!requireName()) return;
        const ev = data.events.find(e => e.id === btn.dataset.ics);
        if (ev) downloadIcs(ev);
      });
    });
    document.querySelectorAll('[data-pickday]').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = btn.dataset.pickday;
        if (draftDateSet.has(d)) draftDateSet.delete(d); else draftDateSet.add(d);
        rerenderForm();
      });
    });
    document.querySelectorAll('[data-unpick]').forEach(btn => {
      btn.addEventListener('click', () => { draftDateSet.delete(btn.dataset.unpick); rerenderForm(); });
    });
    document.querySelectorAll('[data-calnav]').forEach(btn => {
      btn.addEventListener('click', () => { pickerMonth.setMonth(pickerMonth.getMonth() + parseInt(btn.dataset.calnav)); rerenderForm(); });
    });
    document.querySelectorAll('[data-repeat-toggle]').forEach(btn => {
      btn.addEventListener('click', () => { repeatOn = !repeatOn; rerenderForm(); });
    });
    const fillBtn = document.getElementById('pp-range-fill');
    if (fillBtn) fillBtn.addEventListener('click', () => {
      const from = document.getElementById('pp-range-from').value;
      const to = document.getElementById('pp-range-to').value;
      if (!from || !to || from > to) { setStatus('Pick a valid start and end date.'); return; }
      const locked = lockedDatesSet();
      let cur = new Date(from + 'T00:00:00');
      const end = new Date(to + 'T00:00:00');
      let skipped = 0;
      while (cur <= end) {
        const iso = cur.toISOString().slice(0, 10);
        if (locked.has(iso)) skipped++; else draftDateSet.add(iso);
        cur.setDate(cur.getDate() + 1);
      }
      if (skipped) setStatus(`Skipped ${skipped} day${skipped > 1 ? 's' : ''} already set elsewhere.`);
      rerenderForm();
    });
    document.querySelectorAll('[data-ovday]').forEach(btn => {
      btn.addEventListener('click', () => { ovSelectedDay = ovSelectedDay === btn.dataset.ovday ? null : btn.dataset.ovday; render(); });
    });
    document.querySelectorAll('[data-ovnav]').forEach(btn => {
      btn.addEventListener('click', () => { overviewMonth.setMonth(overviewMonth.getMonth() + parseInt(btn.dataset.ovnav)); render(); });
    });
    const repeatBtn = document.getElementById('pp-repeat-apply');
    if (repeatBtn) repeatBtn.addEventListener('click', () => {
      if (!draftDateSet.size) { setStatus('Pick at least one date first.'); return; }
      const freqDays = parseInt(document.getElementById('pp-repeat-freq').value);
      const count = Math.min(12, Math.max(1, parseInt(document.getElementById('pp-repeat-count').value) || 1));
      const locked = lockedDatesSet();
      const anchors = [...draftDateSet];
      let skipped = 0;
      anchors.forEach(anchor => {
        let cur = new Date(anchor + 'T00:00:00');
        for (let i = 1; i < count; i++) {
          if (freqDays === 30) cur.setMonth(cur.getMonth() + 1); else cur.setDate(cur.getDate() + freqDays);
          const iso = cur.toISOString().slice(0, 10);
          if (locked.has(iso)) skipped++; else draftDateSet.add(iso);
        }
      });
      if (skipped) setStatus(`Added the series — skipped ${skipped} day(s) already set elsewhere.`);
      rerenderForm();
    });
    document.querySelectorAll('[data-guest-inc]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!requireName()) return;
        const ev = data.events.find(e => e.id === btn.dataset.guestInc);
        if (!ev) return;
        ev.plusOnes = ev.plusOnes || {};
        ev.plusOnes[myName] = Math.min(10, (ev.plusOnes[myName] || 0) + 1);
        save(); render();
      });
    });
    document.querySelectorAll('[data-guest-dec]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!requireName()) return;
        const ev = data.events.find(e => e.id === btn.dataset.guestDec);
        if (!ev) return;
        ev.plusOnes = ev.plusOnes || {};
        const next = Math.max(0, (ev.plusOnes[myName] || 0) - 1);
        if (next === 0) delete ev.plusOnes[myName]; else ev.plusOnes[myName] = next;
        save(); render();
      });
    });
    document.querySelectorAll('[data-bring-add]').forEach(btn => {
      btn.addEventListener('click', () => {
        const evId = btn.dataset.bringAdd;
        const input = document.getElementById('pp-bring-input-' + evId);
        const label = input.value.trim();
        if (!label) return;
        const ev = data.events.find(e => e.id === evId);
        if (!ev) return;
        ev.bring = ev.bring || [];
        ev.bring.push({ id: 'b' + Date.now() + Math.random().toString(36).slice(2, 5), label, claimedBy: null });
        save(); render();
      });
    });
    document.querySelectorAll('[data-bring-claim]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!requireName()) return;
        const [evId, itemId] = btn.dataset.bringClaim.split('|');
        const ev = data.events.find(e => e.id === evId);
        if (!ev) return;
        const item = (ev.bring || []).find(i => i.id === itemId);
        if (!item || item.claimedBy) return;
        item.claimedBy = myName;
        save(); render();
      });
    });
    document.querySelectorAll('[data-bring-unclaim]').forEach(btn => {
      btn.addEventListener('click', () => {
        const [evId, itemId] = btn.dataset.bringUnclaim.split('|');
        const ev = data.events.find(e => e.id === evId);
        if (!ev) return;
        const item = (ev.bring || []).find(i => i.id === itemId);
        if (item) item.claimedBy = null;
        save(); render();
      });
    });
    document.querySelectorAll('[data-bring-del]').forEach(btn => {
      btn.addEventListener('click', () => {
        const [evId, itemId] = btn.dataset.bringDel.split('|');
        const ev = data.events.find(e => e.id === evId);
        if (!ev) return;
        ev.bring = (ev.bring || []).filter(i => i.id !== itemId);
        save(); render();
      });
    });
    document.querySelectorAll('[data-toggle-guests]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ev = data.events.find(e => e.id === btn.dataset.toggleGuests);
        if (!ev) return;
        ev.guestsEnabled = !guestsOnFor(ev);
        save(); render();
      });
    });
    document.querySelectorAll('[data-toggle-bring]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ev = data.events.find(e => e.id === btn.dataset.toggleBring);
        if (!ev) return;
        ev.bringEnabled = !bringOnFor(ev);
        save(); render();
      });
    });
  }

  function moveEvent(id, dir) {
    const openIds = openEvents().map(e => e.id);
    const pos = openIds.indexOf(id);
    const swapPos = pos + dir;
    if (swapPos < 0 || swapPos >= openIds.length) return;
    const idA = data.events.findIndex(e => e.id === id);
    const idB = data.events.findIndex(e => e.id === openIds[swapPos]);
    [data.events[idA], data.events[idB]] = [data.events[idB], data.events[idA]];
    save(); render();
  }

  function setStatus(msg) {
    const el = document.getElementById('pp-status');
    el.textContent = msg;
    if (msg) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 2500);
  }

  async function save() {
    try { await setDoc(planRef, data); }
    catch (e) { setStatus('Could not save — check your connection.'); }
  }

  onSnapshot(planRef, (snap) => {
    data = snap.exists() ? (snap.data() || { events: [] }) : { events: [] };
    if (!data.events) data.events = [];
    if (!data.badges) data.badges = {};
    setStatus('');
    if (!formOpen && !Object.keys(finalizing).length) render();
  }, (err) => {
    setStatus('Connection issue — reload the page.');
  });
</script>
</body>
</html>
