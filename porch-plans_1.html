<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Porch Plans</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F0E1; --card: #FFFDF7; --ink: #2B2A25; --ink-soft: #6b6759;
    --pine: #3C6E47; --pine-deep: #2A4E33; --rust: #B5652C; --gold: #E8AE3D;
    --line: #E4DCC6; --yes: #3C6E47; --maybe: #B5652C; --no: #a8433a;
    --purple: #6A3C78;
    --pine-text: var(--pine); --rust-text: var(--rust); --gold-text: var(--gold); --purple-text: var(--purple);
  }
  body[data-dark="true"] {
    --bg: #211F1A; --card: #2B2822; --ink: #F5F0E1; --ink-soft: #A69C87; --line: #3D3931;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    color: var(--ink); font-family: 'Work Sans', sans-serif; min-height: 100vh;
    padding: 20px 16px 60px; max-width: 640px; margin: 0 auto;
  }
  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }
  .pp-header { margin-bottom: 18px; text-align: center; }
  .pp-header-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .pp-chair-icon {
    width: 34px; height: 34px; color: var(--pine-deep); flex-shrink: 0;
    transform-origin: 50% 88%; animation: pp-rock 4.5s ease-in-out infinite;
  }
  @keyframes pp-rock {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  .pp-header h1 { font-size: 30px; font-weight: 700; color: var(--pine-deep); letter-spacing: -0.01em; }
  .pp-header p { margin: 6px 0 0; color: var(--ink-soft); font-size: 14.5px; font-style: italic; font-family: 'Fraunces', serif; }
  .pp-namebar {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
    position: sticky; top: 8px; z-index: 5; box-shadow: 0 2px 10px rgba(43,42,37,0.05);
  }
  .pp-namebar-content { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .pp-namebar label { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
  .pp-namebar input {
    flex: 1; border: none; background: transparent; font-family: 'Work Sans', sans-serif;
    font-size: 16px; font-weight: 600; color: var(--ink); padding: 4px 2px; min-width: 0;
  }
  .pp-namebar input:focus { outline: none; }
  .pp-namebar.pp-shake { animation: pp-shake 0.4s; }
  @keyframes pp-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .pp-namebar input::placeholder { color: #b3ac96; font-weight: 400; }
  .pp-greeting { font-family: 'Fraunces', serif; font-size: 15.5px; font-weight: 600; color: var(--pine-deep); }
  .pp-tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; position: sticky; top: 66px; z-index: 4; }
  .pp-tab { flex: 1; text-align: center; padding: 8px 2px; border-radius: 9px; font-size: 10.5px; font-weight: 600; cursor: pointer; color: var(--ink-soft); background: none; border: none; font-family: 'Work Sans', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pp-idea-card { border-left: 4px solid var(--purple-text); }
  .pp-promote-btn {
    width: 100%; background: var(--card); border: 1.5px dashed var(--purple-text); color: var(--purple-text); font-weight: 700;
    border-radius: 10px; padding: 9px; font-size: 13.5px; cursor: pointer; font-family: 'Work Sans', sans-serif; margin-top: 8px;
  }
  .pp-promote-btn:active { background: var(--purple); color: #fff; }
  .pp-section-title { font-family: 'Fraunces', serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin: 20px 2px 10px; }
  .pp-section-title:first-child { margin-top: 0; }
  .pp-events { display: flex; flex-direction: column; gap: 0; }
  .pp-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 14px; margin-bottom: 14px; position: relative; }
  .pp-card h3 { font-size: 19px; color: var(--ink); }
  .pp-card .pp-note { font-size: 13.5px; color: var(--ink-soft); margin: 3px 0 12px; }
  .pp-priority-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .pp-priority-badge { background: var(--pine); color: #fff; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .pp-reorder { display: flex; gap: 4px; }
  .pp-reorder button { background: var(--card); border: 1px solid var(--line); border-radius: 6px; width: 26px; height: 24px; font-size: 12px; cursor: pointer; color: var(--ink-soft); line-height: 1; }
  .pp-reorder button:disabled { opacity: 0.35; cursor: default; }
  .pp-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 700;
    padding: 5px 11px; border-radius: 999px; margin: 0 6px 10px 0;
  }
  .pp-badge-runner { font-weight: 600; }
  .pp-dates { display: flex; flex-direction: column; gap: 8px; }
  .pp-date-row { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .pp-date-main { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; gap: 10px; }
  .pp-date-label { font-weight: 600; font-size: 15px; }
  .pp-votebtns { display: flex; gap: 5px; }
  .pp-vbtn {
    border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: 13px; font-weight: 600;
    padding: 6px 9px; cursor: pointer; color: var(--ink-soft); font-family: 'Work Sans', sans-serif; transition: transform 0.08s ease;
  }
  .pp-vbtn:active { transform: scale(0.94); }
  .pp-vbtn.pp-active-yes { background: var(--yes); border-color: var(--yes); color: #fff; }
  .pp-vbtn.pp-active-maybe { background: var(--maybe); border-color: var(--maybe); color: #fff; }
  .pp-vbtn.pp-active-no { background: var(--no); border-color: var(--no); color: #fff; }
  .pp-tally { display: flex; gap: 10px; padding: 0 12px 8px; font-size: 12.5px; color: var(--ink-soft); }
  .pp-tally span b { color: var(--ink); }
  .pp-conflict { font-size: 11.5px; color: #8a4b12; background: #FCEBD1; border-radius: 6px; padding: 4px 9px; margin: 0 12px 9px; display: block; }
  .pp-conflict.pp-conflict-locked { color: #6e1f18; background: #F6D9D5; }
  .pp-whoin { border-top: 1px dashed var(--line); padding: 8px 12px 2px; font-size: 12px; color: var(--ink-soft); line-height: 1.6; }
  .pp-whoin b { color: var(--ink); font-weight: 600; }
  .pp-toggle { background: none; border: none; color: var(--rust-text); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 8px 12px 0; font-family: 'Work Sans', sans-serif; }
  .pp-empty { text-align: center; padding: 40px 20px; color: var(--ink-soft); animation: pp-fade-in 0.4s ease; }
  @keyframes pp-fade-in { from { opacity: 0; } to { opacity: 1; } }
  .pp-empty h3 { color: var(--pine-deep); margin-bottom: 6px; font-size: 20px; }
  .pp-finalize-bar { padding: 12px 0 2px; }
  .pp-finalize-btn { width: 100%; background: var(--card); border: 1.5px dashed var(--pine-text); color: var(--pine-text); font-weight: 700; border-radius: 10px; padding: 9px; font-size: 13.5px; cursor: pointer; font-family: 'Work Sans', sans-serif; }
  .pp-finalize-pick { display: flex; gap: 8px; align-items: center; padding: 4px 0 0; flex-wrap: wrap; }
  .pp-finalize-pick select { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 9px; font-size: 14px; font-family: 'Work Sans', sans-serif; min-width: 140px; }
  .pp-finalize-pick button { flex: 0 0 auto; padding: 9px 14px; border-radius: 8px; font-weight: 600; font-size: 13.5px; cursor: pointer; font-family: 'Work Sans', sans-serif; border: 1px solid var(--line); }
  .pp-finalize-pick button.pp-fconfirm { background: var(--pine); border-color: var(--pine); color: #fff; }
  .pp-finalize-pick button.pp-fcancel { background: var(--card); color: var(--ink-soft); }
  .pp-locked-card { border: 1.5px solid var(--gold); box-shadow: 0 0 0 3px rgba(232,174,61,0.15); }
  .pp-locked-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--pine-deep); color: #fff; font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px; margin-bottom: 10px; }
  .pp-attendee-groups { display: flex; flex-direction: column; gap: 3px; font-size: 13px; margin: 2px 0 14px; color: var(--ink-soft); }
  .pp-attendee-groups b { color: var(--ink); }
  .pp-calbtns { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .pp-calbtn {
    flex: 1; min-width: 150px; background: var(--rust); color: #fff; border: none; border-radius: 10px;
    padding: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: 'Work Sans', sans-serif;
    text-align: center; text-decoration: none; display: inline-block;
  }
  .pp-calbtn.pp-cal-secondary { background: var(--card); color: var(--rust-text); border: 1.5px solid var(--rust-text); }
  .pp-reopen { background: none; border: none; color: var(--ink-soft); font-size: 11.5px; text-decoration: underline; cursor: pointer; margin-top: 6px; font-family: 'Work Sans', sans-serif; padding: 0; }
  .pp-addbar { margin-top: 18px; }
  .pp-addbtn { width: 100%; background: var(--pine); color: #fff; border: none; border-radius: 14px; padding: 13px; font-size: 15px; font-weight: 600; font-family: 'Work Sans', sans-serif; cursor: pointer; }
  .pp-addbtn:active { background: var(--pine-deep); }
  .pp-form { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .pp-form label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  .pp-form input[type=text], .pp-form input[type=date] { border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; font-size: 15px; font-family: 'Work Sans', sans-serif; color: var(--ink); width: 100%; }
  .pp-formbtns { display: flex; gap: 8px; margin-top: 4px; }
  .pp-submit, .pp-cancel { flex: 1; border-radius: 10px; padding: 11px; font-weight: 600; font-size: 14px; font-family: 'Work Sans', sans-serif; cursor: pointer; border: 1px solid var(--line); }
  .pp-submit { background: var(--pine); color: #fff; border-color: var(--pine); }
  .pp-cancel { background: var(--card); color: var(--ink-soft); }
  .pp-delx { position: absolute; top: 14px; right: 14px; background: none; border: none; color: #c9c2aa; font-size: 15px; cursor: pointer; }
  .pp-editx { position: absolute; top: 12px; right: 38px; background: none; border: none; color: var(--ink-soft); font-size: 18px; font-weight: 700; cursor: pointer; padding: 2px 4px; }
  .pp-add-location-btn { background: none; border: none; color: var(--rust-text); font-size: 12.5px; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; margin-bottom: 8px; font-family: 'Work Sans', sans-serif; }
  .pp-status { text-align: center; color: var(--ink-soft); font-size: 12.5px; padding: 10px 0 0; min-height: 18px; }

  .pp-cal { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .pp-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-weight: 600; font-size: 14px; }
  .pp-cal-nav { background: var(--card); border: 1px solid var(--line); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; color: var(--ink); }
  .pp-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .pp-cal-dow { font-size: 10.5px; color: var(--ink-soft); text-align: center; font-weight: 600; padding-bottom: 2px; }
  .pp-cal-day { aspect-ratio: 1; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: 13px; cursor: pointer; color: var(--ink); font-family: 'Work Sans', sans-serif; position: relative; }
  .pp-cal-weather-badge { position: absolute; bottom: -3px; right: -3px; font-size: 10px; line-height: 1; pointer-events: none; }
  .pp-cal-day.pp-cal-selected { background: var(--pine); color: #fff; border-color: var(--pine); font-weight: 700; }
  .pp-cal-day.pp-cal-past { opacity: 0.3; cursor: default; }
  .pp-cal-day.pp-cal-empty { visibility: hidden; border: none; cursor: default; }
  .pp-cal-day.pp-cal-blocked { background: repeating-linear-gradient(45deg, #F6D9D5, #F6D9D5 4px, #fce9e6 4px, #fce9e6 8px); color: #8a3a32; opacity: 1; cursor: not-allowed; border-color: #e3b9b3; }
  .pp-cal-day.pp-cal-today { box-shadow: 0 0 0 2px var(--pine-deep) inset; }
  .pp-cal-day.pp-cal-haslocked { background: var(--pine); color: #fff; border-color: var(--pine); font-weight: 700; }
  .pp-cal-day.pp-cal-hascandidate { background: var(--card); font-weight: 700; }
  .pp-cal-day.pp-cal-daytapped { box-shadow: 0 0 0 2px var(--rust) inset; }
  .pp-cal-range { display: flex; gap: 6px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .pp-cal-range input { flex: 1; min-width: 110px; }
  .pp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pp-chip { background: var(--pine); color: #fff; font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 5px 10px; display: flex; align-items: center; gap: 6px; }
  .pp-chip button { background: none; border: none; color: #fff; font-size: 13px; cursor: pointer; padding: 0; line-height: 1; }
  .pp-cal-legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--ink-soft); margin-top: 10px; flex-wrap: wrap; }
  .pp-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .pp-dot-pine { background: var(--pine); }
  .pp-dot-gold { background: var(--card); border: 2px solid var(--gold); }
  .pp-ov-detail { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--ink-soft); line-height: 1.7; }
  .pp-ov-detail b { color: var(--ink); }
  .pp-ov-link { background: none; border: none; padding: 0; font: inherit; color: var(--rust-text); font-weight: 600; text-decoration: underline; cursor: pointer; }
  .pp-hint { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
  .pp-fab {
    position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); right: 20px;
    width: 56px; height: 56px; border-radius: 50%; background: var(--pine); color: #fff;
    font-size: 28px; line-height: 1; border: none; box-shadow: 0 4px 14px rgba(43,42,37,0.3);
    cursor: pointer; z-index: 30; display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s ease;
  }
  .pp-fab:active { background: var(--pine-deep); transform: scale(0.88); }
  .pp-help-fab { left: 20px; right: auto; background: var(--rust); font-family: 'Fraunces', serif; font-weight: 700; font-size: 24px; }
  .pp-help-fab:active { background: #94531f; }
  .pp-help-section { margin-bottom: 16px; }
  .pp-help-section h4 { font-family: 'Fraunces', serif; font-size: 15px; color: var(--pine-deep); margin: 0 0 4px; }
  .pp-help-section p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 6px; }
  .pp-help-section p:last-child { margin-bottom: 0; }
  .pp-help-section ul { margin: 4px 0 0 18px; padding: 0; font-size: 13.5px; color: var(--ink-soft); line-height: 1.7; }
  .pp-help-section ul b { color: var(--ink); }
  .pp-help-legend-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); }
  .pp-modal-overlay {
    position: fixed; inset: 0; background: rgba(43,42,37,0.55); z-index: 40;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .pp-modal-enter { animation: pp-overlay-in 0.2s ease; }
  .pp-modal-enter .pp-modal-sheet { animation: pp-sheet-in 0.28s cubic-bezier(0.16,1,0.3,1); }
  @keyframes pp-overlay-in { from { background: rgba(43,42,37,0); } to { background: rgba(43,42,37,0.55); } }
  @keyframes pp-sheet-in { from { transform: translateY(28px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .pp-modal-sheet {
    background: var(--bg); width: 100%; max-width: 640px; max-height: 93vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 30px rgba(0,0,0,0.25);
  }
  .pp-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .pp-modal-head h3 { font-size: 19px; color: var(--pine-deep); }
  .pp-modal-close { background: var(--card); border: 1px solid var(--line); border-radius: 50%; width: 30px; height: 30px; font-size: 14px; cursor: pointer; color: var(--ink-soft); }
  .pp-modal-sheet .pp-form { background: transparent; border: none; padding: 0; margin-top: 0; }
  .pp-nextup { display: none; background: linear-gradient(135deg, var(--pine), var(--pine-deep)); color: #fff; padding: 11px 14px; border-radius: 12px; font-size: 13.5px; margin-bottom: 14px; }
  .pp-nextup b { font-family: 'Fraunces', serif; }
  .pp-nextup-when { opacity: 0.85; font-size: 12px; }
  .pp-location-link { color: var(--rust-text); text-decoration: none; font-weight: 600; }
  .pp-location-link:active { opacity: 0.7; }
  .pp-weather-icon { font-size: 13px; vertical-align: middle; }
  .pp-guests-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 13px; color: var(--ink-soft); flex-wrap: wrap; }
  .pp-stepper { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; }
  .pp-stepper button { background: none; border: none; width: 24px; height: 24px; font-size: 16px; cursor: pointer; color: var(--pine-text); font-weight: 700; }
  .pp-stepper span { min-width: 14px; text-align: center; font-weight: 700; color: var(--ink); }
  .pp-guests-total { font-size: 12px; color: var(--rust-text); font-weight: 600; }
  .pp-bring { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; }
  .pp-bring h4 { font-family: 'Fraunces', serif; font-size: 13px; color: var(--pine-deep); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .pp-bring-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--line); gap: 8px; }
  .pp-bring-item:last-child { border-bottom: none; }
  .pp-bring-claim { background: var(--card); border: 1px solid var(--pine-text); color: var(--pine-text); border-radius: 8px; padding: 4px 9px; font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: 'Work Sans', sans-serif; }
  .pp-bring-claimed { color: var(--ink-soft); font-weight: 600; }
  .pp-bring-del { background: none; border: none; color: #c9c2aa; cursor: pointer; font-size: 13px; }
  .pp-bring-add { display: flex; gap: 6px; margin-top: 8px; }
  .pp-bring-add input { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 13px; font-family: 'Work Sans', sans-serif; }
  .pp-bring-add button { background: var(--pine); color: #fff; border: none; border-radius: 8px; padding: 7px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: 'Work Sans', sans-serif; }
  .pp-toggles { display: flex; gap: 20px; margin: 6px 0 12px; flex-wrap: wrap; }
  .pp-switch-row { display: flex; align-items: center; gap: 9px; }
  .pp-switch {
    position: relative; width: 42px; height: 24px; border-radius: 999px; border: none;
    background: #ddd6c2; cursor: pointer; padding: 0; flex-shrink: 0; transition: background 0.15s ease;
  }
  .pp-switch.pp-switch-on { background: var(--pine); }
  .pp-switch-knob {
    position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;

  const SEASON_ROLE_FAMILY = {

    }

  }
  // A brighter/emphasis variant, used for header text and the rocking-chair icon.
  // In light mode this goes a step darker (bolder emphasis on a light page).
  // In dark mode it goes light instead — the whole point is contrast against a dark
  // background, so pushing it darker there would make it disappear.
  function themedInkDeep(role) {
    const theme = currentTheme();
    const family = roleFamily(role);
    let idx = Math.max(roleBaseIndex(role), 4);
    idx = theme.darkMode ? Math.max(0, idx - 5) : Math.min(8, idx + 1);
    return COLOR_RAMPS[family][idx];
  }
  // A light ring/accent shade for "still being considered" style indicators. Tied to
  // the same system-wide gold role the legend swatch uses, so they never mismatch —
  // always light, so it reads as a distinct ring against a solid "confirmed" fill even
  // in monochrome mode, and stays visible against both light and dark chrome.
  function lightRingFor() {
    return COLOR_RAMPS[roleFamily('gold')][1];
  }
  // The page's own background (not the little card surfaces on top of it, which stay
  // neutral) — a soft tint of the primary role's family, so the "vibe" carries even
  // in the empty space around content. Dark mode uses the same family's darkest step.
  function themedBg() {
    const theme = currentTheme();
    const family = roleFamily('pine');
    return COLOR_RAMPS[family][theme.darkMode ? 8 : 0];
  }
  // For text-only and outline-style elements (no solid fill behind them) — a colored
  // link or dashed-border button sits directly on the card surface, so in dark mode
  // it needs to go LIGHTER to stay legible, the opposite direction from the solid-fill
  // "ink" shades above. Light mode is identical to themedInk (no visual change there).
  function themedText(role) {
    const theme = currentTheme();
    const family = roleFamily(role);
    let idx = Math.max(roleBaseIndex(role), 4);
    if (theme.darkMode) idx = Math.max(1, idx - 4);
    return COLOR_RAMPS[family][idx];
  }
  function applyThemeVars() {
    const b = document.body.style;
    const metaEl = document.getElementById('pp-theme-color-meta');
    if (!currentUser || !myProfile) {
      ['--pine', '--pine-deep', '--rust', '--gold', '--purple', '--bg',
       '--pine-text', '--rust-text', '--gold-text', '--purple-text'].forEach(v => b.removeProperty(v));
      if (metaEl) metaEl.setAttribute('content', '#F5F0E1');
      return;
    }
    b.setProperty('--pine', themedInk('pine'));
    b.setProperty('--pine-deep', themedInkDeep('pine'));
    b.setProperty('--rust', themedInk('rust'));
    b.setProperty('--gold', themedInk('gold'));
    b.setProperty('--purple', themedInk('purple'));
    const bgHex = themedBg();
    b.setProperty('--bg', bgHex);
    b.setProperty('--pine-text', themedText('pine'));
    b.setProperty('--rust-text', themedText('rust'));
    b.setProperty('--gold-text', themedText('gold'));
    b.setProperty('--purple-text', themedText('purple'));
    if (metaEl) metaEl.setAttribute('content', bgHex);
  }

  function badgeIconHtml(iconId, hex, sizePx) {
    if (!iconId) return '';
    const url = ICON_BASE_PATH + iconId + '.svg';
    const inner = Math.max(9, Math.round(sizePx * 0.74));
    return `<span class="pp-badge-icon-wrap" style="width:${sizePx}px;height:${sizePx}px;background-color:${hex};">` +
      `<span style="display:block;width:${inner}px;height:${inner}px;background-color:#FFFDF7;` +
      `-webkit-mask-image:url('${url}');mask-image:url('${url}');` +
      `-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;` +
      `-webkit-mask-position:center;mask-position:center;` +
      `-webkit-mask-size:98% 98%;mask-size:98% 98%;"></span></span>`;
  }
  function nameWithBadge(name) {
    const b = data.badges && data.badges[name];
    if (!b) return escapeHtml(name);
    return `<span class="pp-name-badge">${badgeIconHtml(b.icon, b.hex, 16)}${escapeHtml(name)}</span>`;
  }

  function daysGridFor(monthDate) {
    const year = monthDate.getFullYear(), month = monthDate.getMonth();
    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      cells.push(`${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
    }
    while (cells.length % 7 !== 0) cells.push(null);
    return cells;
  }

  function tallyFor(ev, dateIso) {
    let yes = 0, maybe = 0, no = 0;
    Object.values(ev.votes || {}).forEach(pv => {
      const v = pv[dateIso];
      if (v === 'yes') yes++; else if (v === 'maybe') maybe++; else if (v === 'no') no++;
    });
    return { yes, maybe, no };
  }

  function topDates(ev) {
    if (!ev.dates.length) return { top: null, runnerUp: null };
    const scored = ev.dates.map(d => {
      const t = tallyFor(ev, d);
      return { date: d, score: t.yes * 2 + t.maybe, total: t.yes + t.maybe + t.no };
    });
    const totalVotes = scored.reduce((s, x) => s + x.total, 0);
    if (totalVotes < 2) return { top: null, runnerUp: null };
    scored.sort((a, b) => b.score - a.score);
    const top = scored[0].score > 0 ? scored[0].date : null;
    let runnerUp = null;
    if (top && scored.length > 1 && scored[1].score > 0 && scored[1].score < scored[0].score) {
      runnerUp = scored[1].date;
    }
    return { top, runnerUp };
  }

  function whoSaid(ev, dateIso) {
    const groups = { yes: [], maybe: [], no: [] };
    Object.entries(ev.votes || {}).forEach(([person, votes]) => {
      const v = votes[dateIso];
      if (v && groups[v]) groups[v].push(person);
    });
    return groups;
  }

  function openEvents() { return data.events.filter(e => e.status === 'open' || !e.status); }
  function lockedEvents() { return data.events.filter(e => e.status === 'finalized'); }
  // If every candidate date on a still-open gathering has passed with no date ever set,
  // quietly retire it rather than leaving stale, un-votable dates cluttering Planning.
  // The data isn't deleted — it's kept so a future "Their Gatherings" view can resurface
  // it for the creator to re-suggest with fresh dates.
  function checkExpirations() {
    const today = todayIso();
    let changed = false;
    data.events.forEach(ev => {
      if ((ev.status === 'open' || !ev.status) && ev.dates.length && ev.dates.every(d => d < today)) {
        ev.status = 'expired';
        changed = true;
      }
    });
    if (changed) save();
  }
  function dateUsedElsewhere(iso) {
    return data.events.some(e => e.status === 'finalized' ? e.finalDate === iso : (e.dates || []).includes(iso));
  }
  function eventsOnDay(iso) {
    return {
      locked: lockedEvents().filter(e => e.finalDate === iso),
      candidate: openEvents().filter(e => (e.dates || []).includes(iso))
    };
  }

  function conflictsFor(ev, idxInOpen) {
    const higher = openEvents().slice(0, idxInOpen).concat(lockedEvents());
    const out = {};
    ev.dates.forEach(d => {
      for (const other of higher) {
        const hit = other.status === 'finalized' ? other.finalDate === d : (other.dates || []).includes(d);
        if (hit) { out[d] = { title: other.title, locked: other.status === 'finalized' }; break; }
      }
    });
    return out;
  }

  function mapsUrl(loc) { return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc)}`; }

  function headcountFor(ev) {
    const who = whoSaid(ev, ev.finalDate);
    if (ev.guestsEnabled === false) return who.yes.length;
    const extra = who.yes.reduce((sum, name) => sum + ((ev.plusOnes && ev.plusOnes[name]) || 0), 0);
    return who.yes.length + extra;
  }

  function guestsOnFor(ev) { return ev.guestsEnabled !== false; }
  function bringOnFor(ev) { return ev.bringEnabled !== false; }
  // Ownership here just means "currently using the same name as whoever created it" —
  // consistent with the rest of the app's trust-based, no-login identity model, not a
  // hardened permission system.
  function isOwnerOf(ev) { return !!(ev.createdBy && myName && ev.createdBy === myName); }

  function renderEventToggles(ev) {
    if (!isOwnerOf(ev)) return '';
    const guestsOn = guestsOnFor(ev);
    const bringOn = bringOnFor(ev);
    return `
      <div class="pp-toggles">
        <div class="pp-switch-row">
          <button type="button" class="pp-switch ${guestsOn ? 'pp-switch-on' : ''}" data-toggle-guests="${ev.id}"><span class="pp-switch-knob"></span></button>
          <span class="pp-switch-label">Track guests</span>
        </div>
        <div class="pp-switch-row">
          <button type="button" class="pp-switch ${bringOn ? 'pp-switch-on' : ''}" data-toggle-bring="${ev.id}"><span class="pp-switch-knob"></span></button>
          <span class="pp-switch-label">Bring list</span>
        </div>
      </div>`;
  }

  function weatherGlyph(w) {
    if ([95, 96, 99].includes(w.code)) return { icon: '⛈️', label: 'Storms' };
    if ([71, 73, 75, 77, 85, 86].includes(w.code)) return { icon: '❄️', label: 'Snow' };
    if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(w.code)) return { icon: '🌧️', label: 'Rain' };
    if ([45, 48].includes(w.code)) return { icon: '🌫️', label: 'Foggy' };
    if (w.wind && w.wind >= 20) return { icon: '🌬️', label: 'Windy' };
    if (w.code === 0) return { icon: '☀️', label: 'Sunny' };
    if ([1, 2, 3].includes(w.code)) return { icon: '⛅', label: 'Partly cloudy' };
    return { icon: '🌡️', label: 'Weather' };
  }

  function weatherEligible(location, dateIso) {
    if (!location) return false;
    const today = todayIso();
    if (dateIso < today) return false;
    const daysOut = Math.round((new Date(dateIso + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000);
    return daysOut <= 15;
  }

  function weatherIconFor(location, dateIso) {
    if (!weatherEligible(location, dateIso)) return '';
    const key = location.trim().toLowerCase();
    const geo = geocodeCache[key];
    if (!geo || geo === 'loading') return '';
    if (geo === 'error') return '';
    const wKey = `${key}|${dateIso}`;
    const w = weatherCache[wKey];
    if (!w || w === 'loading' || w === 'error') return '';
    const g = weatherGlyph(w);
    return `<span class="pp-weather-icon" title="${g.label}">${g.icon}</span>`;
  }

  const WEATHER_TTL_MS = 3 * 60 * 60 * 1000;

  async function ensureWeatherFor(location, dateIso) {
    if (!weatherEligible(location, dateIso)) return;
    const key = location.trim().toLowerCase();
    if (!(key in geocodeCache)) {
      geocodeCache[key] = 'loading';
      try {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=1`);
        const j = await res.json();
        geocodeCache[key] = (j.results && j.results[0]) ? { lat: j.results[0].latitude, lon: j.results[0].longitude } : 'error';
      } catch (e) { geocodeCache[key] = 'error'; }
      render();
      return;
    }
    const geo = geocodeCache[key];
    if (geo === 'loading' || geo === 'error') return;
    const wKey = `${key}|${dateIso}`;
    const cached = weatherCache[wKey];
    if (cached === 'loading') return;
    if (cached && cached !== 'error' && (Date.now() - cached.fetchedAt) < WEATHER_TTL_MS) return;
    weatherCache[wKey] = 'loading';
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&daily=weathercode,windspeed_10m_max&timezone=auto&start_date=${dateIso}&end_date=${dateIso}`);
      const j = await res.json();
      weatherCache[wKey] = (j.daily && j.daily.time && j.daily.time.length)
        ? { code: j.daily.weathercode[0], wind: j.daily.windspeed_10m_max ? j.daily.windspeed_10m_max[0] : 0, fetchedAt: Date.now() }
        : 'error';
    } catch (e) { weatherCache[wKey] = 'error'; }
    render();
  }

  function weatherIconForCoords(lat, lon, dateIso) {
    if (!weatherEligible('x', dateIso)) return '';
    const wKey = `coord:${lat.toFixed(2)},${lon.toFixed(2)}|${dateIso}`;
    const w = weatherCache[wKey];
    if (!w || w === 'loading' || w === 'error') return '';
    const g = weatherGlyph(w);
    return `<span class="pp-weather-icon" title="${g.label}">${g.icon}</span>`;
  }

  async function ensureWeatherForCoords(lat, lon, dateIso) {
    if (!weatherEligible('x', dateIso)) return;
    const wKey = `coord:${lat.toFixed(2)},${lon.toFixed(2)}|${dateIso}`;
    const cached = weatherCache[wKey];
    if (cached === 'loading') return;
    if (cached && cached !== 'error' && (Date.now() - cached.fetchedAt) < WEATHER_TTL_MS) return;
    weatherCache[wKey] = 'loading';
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,windspeed_10m_max&timezone=auto&start_date=${dateIso}&end_date=${dateIso}`);
      const j = await res.json();
      weatherCache[wKey] = (j.daily && j.daily.time && j.daily.time.length)
        ? { code: j.daily.weathercode[0], wind: j.daily.windspeed_10m_max ? j.daily.windspeed_10m_max[0] : 0, fetchedAt: Date.now() }
        : 'error';
    } catch (e) { weatherCache[wKey] = 'error'; }
    render();
  }

  // Prefer known coordinates carried along with the gathering (e.g. from an unedited
  // default address) over re-geocoding the display text, since a full street address
  // may not resolve as reliably through a city-name search as the city alone does.
  function weatherIconForEventDate(ev, dateIso) {
    if (ev.locationGeo) return weatherIconForCoords(ev.locationGeo.lat, ev.locationGeo.lon, dateIso);
    return ev.location ? weatherIconFor(ev.location, dateIso) : '';
  }
  async function ensureWeatherForEventDate(ev, dateIso) {
    if (ev.locationGeo) { await ensureWeatherForCoords(ev.locationGeo.lat, ev.locationGeo.lon, dateIso); return; }
    if (ev.location) await ensureWeatherFor(ev.location, dateIso);
  }

  function renderAddressSuggestionsHtml() {
    return addressSuggestions.length
      ? `<div class="pp-address-suggestions">${addressSuggestions.map((s, i) => `<button type="button" class="pp-address-suggestion" data-address-pick="${i}">${escapeHtml(s.label)}</button>`).join('')}</div>`
      : '';
  }
  function renderAddressCheckHtml() {
    return draftAddressGeo ? `<span class="pp-address-check" title="Set — powers weather on your Calendar tab">✓</span>` : '';
  }
  function renderAddressStatusHtml() {
    return (!draftAddressGeo && draftAddressLabel) ? '<p class="pp-hint">Pick a suggestion below to enable Calendar weather.</p>' : '';
  }
  function updateAddressSuggestionsUI() {
    const wrap = document.getElementById('pp-address-suggestions-wrap');
    if (wrap) wrap.innerHTML = renderAddressSuggestionsHtml();
    const check = document.getElementById('pp-address-check');
    if (check) check.innerHTML = renderAddressCheckHtml();
    const status = document.getElementById('pp-address-status');
    if (status) status.innerHTML = renderAddressStatusHtml();
    document.querySelectorAll('[data-address-pick]').forEach(btn => {
      btn.onclick = () => {
        const s = addressSuggestions[parseInt(btn.dataset.addressPick)];
        if (!s) return;
        draftAddressLabel = s.label;
        draftAddressGeo = { lat: s.lat, lon: s.lon };
        addressSuggestions = [];
        const input = document.getElementById('pp-profile-address');
        if (input) input.value = draftAddressLabel;
        updateAddressSuggestionsUI();
      };
    });
  }
  async function runAddressSearch(query) {
    if (!query || query.trim().length < 2) { addressSuggestions = []; updateAddressSuggestionsUI(); return; }
    try {
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query.trim())}&count=5`);
      const j = await res.json();
      addressSuggestions = (j.results || []).map(r => ({
        label: [r.name, r.admin1, r.country].filter(Boolean).join(', '),
        lat: r.latitude, lon: r.longitude
      }));
    } catch (e) { addressSuggestions = []; }
    updateAddressSuggestionsUI();
  }
  function searchAddressSuggestions(query) {
    clearTimeout(addressSearchTimer);
    if (!query || query.trim().length < 2) { addressSuggestions = []; updateAddressSuggestionsUI(); return; }
    addressSearchTimer = setTimeout(() => runAddressSearch(query), 350);
  }

  function nextUpcoming() {
    const today = todayIso();
    return lockedEvents().filter(e => e.finalDate >= today).sort((a, b) => a.finalDate.localeCompare(b.finalDate))[0] || null;
  }
  function daysUntil(iso) {
    return Math.round((new Date(iso + 'T00:00:00') - new Date(todayIso() + 'T00:00:00')) / 86400000);
  }
  function renderNextUp() {
    const el = document.getElementById('pp-nextup');
    const ev = nextUpcoming();
    if (!ev) { el.innerHTML = ''; el.style.display = 'none'; return; }
    const d = daysUntil(ev.finalDate);
    const when = d === 0 ? 'today!' : d === 1 ? 'tomorrow' : `in ${d} days`;
    el.style.display = 'block';
    el.innerHTML = `Coming up: <b>${escapeHtml(ev.title)}</b> — ${fmtDate(ev.finalDate)} <span class="pp-nextup-when">(${when})</span><span class="pp-nextup-arrow">›</span>`;
  }

  function renderGuestStepper(ev) {
    const mine = (ev.plusOnes && ev.plusOnes[myName]) || 0;
    const total = Object.values(ev.plusOnes || {}).reduce((a, b) => a + b, 0);
    return `
      <div class="pp-guests-row">
        <span>Bringing extra guests?</span>
        <div class="pp-stepper">
          <button type="button" data-guest-dec="${ev.id}">−</button>
          <span>${mine}</span>
          <button type="button" data-guest-inc="${ev.id}">+</button>
        </div>
        ${total > 0 ? `<span class="pp-guests-total">+${total} extra total</span>` : ''}
      </div>`;
  }

  function renderBringList(ev) {
    const items = ev.bring || [];
    const rows = items.map(it => {
      const isMine = it.claimedBy && it.claimedBy === myName;
      const claimedLabel = it.claimedBy ? `<span class="pp-bring-claimed">${nameWithBadge(it.claimedBy)}</span>` : `<button type="button" class="pp-bring-claim" data-bring-claim="${ev.id}|${it.id}">Claim</button>`;
      return `
        <div class="pp-bring-item">
          <span>${escapeHtml(it.label)}</span>
          <span style="display:flex;align-items:center;gap:8px;">
            ${claimedLabel}
            ${isMine ? `<button type="button" class="pp-bring-claim" data-bring-unclaim="${ev.id}|${it.id}">Undo</button>` : ''}
            <button type="button" class="pp-bring-del" data-bring-del="${ev.id}|${it.id}" title="Remove item">✕</button>
          </span>
        </div>`;
    }).join('');
    return `
      <div class="pp-bring">
        <h4>What to bring</h4>
        ${rows || '<div class="pp-hint" style="margin-top:0;">Nothing listed yet.</div>'}
        <div class="pp-bring-add">
          <input type="text" id="pp-bring-input-${ev.id}" placeholder="Add an item…" maxlength="40" />
          <button type="button" data-bring-add="${ev.id}">Add</button>
        </div>
      </div>`;
  }

  function renderTabs() {
    const el = document.getElementById('pp-tabs');
    const today = todayIso();
    const open = openEvents().length;
    const locked = lockedEvents().filter(e => e.finalDate >= today).length;
    const archived = lockedEvents().filter(e => e.finalDate < today).length;
    const tabs = [];
    if (currentUser && myProfile) {
      tabs.push({ id: 'ideas', label: `Ideas (${(myProfile.ideas || []).length})` });
    }
    tabs.push(
      { id: 'planning', label: `Planning (${open})` },
      { id: 'locked', label: `Set (${locked})` },
      { id: 'archive', label: `Memories (${archived})` },
      { id: 'calendar', label: 'Calendar' }
    );
    el.innerHTML = tabs.map(t => {
      const active = activeTab === t.id;
      let style = '';
      if (active) {
        const c = tabColorFor(t.id);
        style = ` style="background:${c.hex};color:${c.dark ? '#2B2A25' : '#fff'};"`;
      }
      return `<button class="pp-tab ${active ? 'pp-tab-active' : ''}" data-tab="${t.id}"${style}>${t.label}</button>`;
    }).join('');
  }

  function render() {
    if (activeTab === 'ideas' && !(currentUser && myProfile)) activeTab = 'planning';
    checkExpirations();
    document.body.dataset.dark = currentTheme().darkMode ? 'true' : 'false';
    applyThemeVars();
    renderNamebar();
    renderNextUp();
    renderTabs();
    const container = document.getElementById('pp-events');
    const today = todayIso();
    if (activeTab === 'ideas') {
      const ideas = (myProfile && myProfile.ideas) || [];
      container.innerHTML = ideas.length
        ? ideas.map(renderIdeaCard).join('')
        : `<div class="pp-empty"><h3>Nothing brewing yet</h3>Tap the + button to jot down your first idea.</div>`;
    } else if (activeTab === 'planning') {
      const open = openEvents();
      container.innerHTML = open.length
        ? open.map((ev, idx) => renderOpenEvent(ev, idx, open.length)).join('')
        : `<div class="pp-empty"><h3>Nothing on the porch yet</h3>Tap the + button to suggest the first gathering.</div>`;
      open.forEach(ev => { ev.dates.forEach(d => ensureWeatherForEventDate(ev, d)); });
      if (scrollToEventId) {
        const targetId = scrollToEventId;
        scrollToEventId = null;
        requestAnimationFrame(() => {
          const el = document.getElementById('pp-event-' + targetId);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('pp-highlight');
            setTimeout(() => el.classList.remove('pp-highlight'), 1600);
          }
        });
      }
    } else if (activeTab === 'locked') {
      const locked = lockedEvents().filter(e => e.finalDate >= today).sort((a, b) => a.finalDate.localeCompare(b.finalDate));
      container.innerHTML = locked.length
        ? locked.map(renderLockedEvent).join('')
        : `<div class="pp-empty"><h3>Nothing set yet</h3>Once a gathering's date is set, it'll show up here.</div>`;
      locked.forEach(ev => { ensureWeatherForEventDate(ev, ev.finalDate); });
      if (scrollToEventId) {
        const targetId = scrollToEventId;
        scrollToEventId = null;
        requestAnimationFrame(() => {
          const el = document.getElementById('pp-event-' + targetId);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('pp-highlight');
            setTimeout(() => el.classList.remove('pp-highlight'), 1600);
          }
        });
      }
    } else if (activeTab === 'archive') {
      const past = lockedEvents().filter(e => e.finalDate < today).sort((a, b) => b.finalDate.localeCompare(a.finalDate));
      container.innerHTML = past.length
        ? past.map(renderLockedEvent).join('')
        : `<div class="pp-empty"><h3>No memories yet</h3>Gatherings move here on their own once the date has passed.</div>`;
    } else if (activeTab === 'calendar') {
      container.innerHTML = renderCalendarOverview();
    }
    renderForm();
    renderIdeaForm();
    renderEditForm();
    renderHelp();
    renderSignin();
    renderProfile();
    renderAvatarButton();
    attachHandlers();
  }

  function renderOpenEvent(ev, idx, openCount) {
    const { top: best, runnerUp } = topDates(ev);
    const conflicts = conflictsFor(ev, idx);
    const calColor = tabColorFor('calendar');
    const calText = calColor.dark ? '#2B2A25' : '#FFFDF7';
    const rows = ev.dates.map(d => {
      const t = tallyFor(ev, d);
      const mine = (ev.votes && ev.votes[myName] && ev.votes[myName][d]) || null;
      const who = expanded[ev.id + d] ? whoSaid(ev, d) : null;
      const c = conflicts[d];
      const isTop = d === best;
      const isRunnerUp = !isTop && d === runnerUp;
      const rowStyle = isTop
        ? ` style="background:${hexToRgba(calColor.hex, 0.2)};border-left:4px solid ${calColor.hex};"`
        : isRunnerUp
          ? ` style="background:${hexToRgba(calColor.hex, 0.1)};border-left:3px solid ${hexToRgba(calColor.hex, 0.5)};"`
          : '';
      return `
        <div class="pp-date-row"${rowStyle}>
          <div class="pp-date-main">
            <div class="pp-date-label">${fmtDate(d)} ${weatherIconForEventDate(ev, d)}</div>
            <div class="pp-votebtns">
              <button class="pp-vbtn ${mine === 'yes' ? 'pp-active-yes' : ''}" data-vote data-event="${ev.id}" data-date="${d}" data-status="yes">Yes</button>
              <button class="pp-vbtn ${mine === 'maybe' ? 'pp-active-maybe' : ''}" data-vote data-event="${ev.id}" data-date="${d}" data-status="maybe">Maybe</button>
              <button class="pp-vbtn ${mine === 'no' ? 'pp-active-no' : ''}" data-vote data-event="${ev.id}" data-date="${d}" data-status="no">No</button>
            </div>
          </div>
          <div class="pp-tally"><span><b>${t.yes}</b> yes</span><span><b>${t.maybe}</b> maybe</span><span><b>${t.no}</b> no</span></div>
          ${c ? `<div class="pp-conflict ${c.locked ? 'pp-conflict-locked' : ''}">${c.locked ? '🔒 Already set for' : '⚠ Lower priority than'} "${escapeHtml(c.title)}"</div>` : ''}
          ${who ? `<div class="pp-whoin">
            ${who.yes.length ? `<b>Yes:</b> ${who.yes.map(nameWithBadge).join(', ')}<br/>` : ''}
            ${who.maybe.length ? `<b>Maybe:</b> ${who.maybe.map(nameWithBadge).join(', ')}<br/>` : ''}
            ${who.no.length ? `<b>No:</b> ${who.no.map(nameWithBadge).join(', ')}` : ''}
            ${(!who.yes.length && !who.maybe.length && !who.no.length) ? 'No one has voted yet.' : ''}
          </div>` : ''}
          <button class="pp-toggle" data-toggle="${ev.id}${d}">${expanded[ev.id + d] ? 'Hide names' : 'See who said what'}</button>
        </div>`;
    }).join('');

    const isFinalizing = !!finalizing[ev.id];
    const defaultPick = best || ev.dates[0];
    const finalizeUi = isFinalizing ? `
      <div class="pp-finalize-pick">
        <select id="pp-fsel-${ev.id}">${ev.dates.map(d => {
          const clash = lockedEvents().find(e => e.id !== ev.id && e.finalDate === d);
          return `<option value="${d}" ${d === defaultPick ? 'selected' : ''}>${fmtDate(d)}${clash ? ` — clashes with "${escapeHtml(clash.title)}"` : ''}</option>`;
        }).join('')}</select>
        <button class="pp-fconfirm" data-final-confirm="${ev.id}">Set the Date</button>
        <button class="pp-fcancel" data-final-cancel="${ev.id}">Cancel</button>
      </div>` : `
      <div class="pp-finalize-bar"><button class="pp-finalize-btn" data-final-toggle="${ev.id}">Set the Date</button></div>`;

    return `
      <div class="pp-card" id="pp-event-${ev.id}">
        <button class="pp-delx" data-delevent="${ev.id}" title="Remove this idea">✕</button>
        ${isOwnerOf(ev) ? `<button class="pp-editx" data-event-edit="${ev.id}" title="Edit this gathering">⋯</button>` : ''}
        <div class="pp-priority-row">
          <span class="pp-priority-badge">Priority ${idx + 1}</span>
          <div class="pp-reorder">
            <button data-moveup="${ev.id}" ${idx === 0 ? 'disabled' : ''} title="Raise priority">▲</button>
            <button data-movedown="${ev.id}" ${idx === openCount - 1 ? 'disabled' : ''} title="Lower priority">▼</button>
          </div>
        </div>
        <h3>${escapeHtml(ev.title)}</h3>
        ${ev.note ? `<div class="pp-note">${escapeHtml(ev.note)}</div>` : ''}
        ${ev.location ? `<div class="pp-note"><a class="pp-location-link" href="${mapsUrl(ev.location)}" target="_blank" rel="noopener">📍 ${escapeHtml(ev.location)}</a></div>` : ''}
        ${renderEventToggles(ev)}
        ${best ? `<div class="pp-badge" style="background:${calColor.hex};color:${calText};">🏆 Top Pick: ${fmtDate(best)}</div>` : ''}
        ${runnerUp ? `<div class="pp-badge pp-badge-runner" style="background:${hexToRgba(calColor.hex, 0.55)};color:${calText};">Runner Up: ${fmtDate(runnerUp)}</div>` : ''}
        <div class="pp-dates">${rows}</div>
        ${finalizeUi}
        ${guestsOnFor(ev) ? renderGuestStepper(ev) : ''}
        ${bringOnFor(ev) ? renderBringList(ev) : ''}
      </div>`;
  }

  function renderLockedEvent(ev) {
    const who = whoSaid(ev, ev.finalDate);
    const heads = headcountFor(ev);
    return `
      <div class="pp-card pp-locked-card" id="pp-event-${ev.id}">
        <button class="pp-delx" data-delevent="${ev.id}" title="Remove this gathering">✕</button>
        <div class="pp-locked-tag">🔒 Set — ${fmtDate(ev.finalDate)}</div>
        <h3>${escapeHtml(ev.title)}</h3>
        ${ev.note ? `<div class="pp-note">${escapeHtml(ev.note)}</div>` : ''}
        ${ev.location ? `<div class="pp-note"><a class="pp-location-link" href="${mapsUrl(ev.location)}" target="_blank" rel="noopener">📍 ${escapeHtml(ev.location)}</a> ${weatherIconForEventDate(ev, ev.finalDate)}</div>` : (isOwnerOf(ev) ? `<button type="button" class="pp-add-location-btn" data-addlocation="${ev.id}">+ Add a location</button>` : '')}
        ${renderEventToggles(ev)}
        <div class="pp-attendee-groups">
          <div><b>Going:</b> ${who.yes.length ? who.yes.map(nameWithBadge).join(', ') : '—'}</div>
          <div><b>Maybe:</b> ${who.maybe.length ? who.maybe.map(nameWithBadge).join(', ') : '—'}</div>
          <div><b>Can't make it:</b> ${who.no.length ? who.no.map(nameWithBadge).join(', ') : '—'}</div>
          ${heads > 0 ? `<div><b>Total heads:</b> ${heads}${heads !== who.yes.length ? ' (incl. guests)' : ''}</div>` : ''}
        </div>
        ${guestsOnFor(ev) ? renderGuestStepper(ev) : ''}
        ${bringOnFor(ev) ? renderBringList(ev) : ''}
        <div class="pp-calbtns">
          <button class="pp-calbtn" data-gcal="${ev.id}">Add to Google Calendar</button>
          <button class="pp-calbtn pp-cal-secondary" data-ics="${ev.id}">Download calendar file</button>
        </div>
        <button class="pp-reopen" data-reopen="${ev.id}">Not final after all? Reopen this gathering</button>
      </div>`;
  }

  function lockedDatesSet() { return new Set(lockedEvents().map(e => e.finalDate)); }

  function renderDatePicker() {
    const today = todayIso();
    const locked = lockedDatesSet();
    const cells = daysGridFor(pickerMonth);
    const locInput = document.getElementById('pp-f-location');
    const locationVal = locInput ? locInput.value.trim() : '';
    if (locationVal) { cells.forEach(iso => { if (iso) ensureWeatherFor(locationVal, iso); }); }
    const dow = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    const grid = cells.map(iso => {
      if (!iso) return `<div class="pp-cal-day pp-cal-empty"></div>`;
      const isPast = iso < today;
      const isLockedDay = locked.has(iso);
      const sel = draftDateSet.has(iso);
      const used = !sel && !isLockedDay && dateUsedElsewhere(iso);
      const disabled = isPast || isLockedDay;
      const title = isLockedDay ? ' title="Already set for another gathering"' : '';
      const wIcon = (!isPast && !isLockedDay && locationVal) ? weatherIconFor(locationVal, iso) : '';
      const badge = wIcon ? `<span class="pp-cal-weather-badge">${wIcon}</span>` : '';
      const usedStyle = used ? ` style="box-shadow: inset 0 -3px 0 ${lightRingFor()};"` : '';
      return `<button type="button" class="pp-cal-day ${sel ? 'pp-cal-selected' : ''} ${isPast ? 'pp-cal-past' : ''} ${isLockedDay ? 'pp-cal-blocked' : ''} ${used ? 'pp-cal-used' : ''}" ${disabled ? 'disabled' : ''}${title}${usedStyle} data-pickday="${iso}">${parseInt(iso.slice(8))}${badge}</button>`;
    }).join('');
    const chips = [...draftDateSet].sort().map(d => `<span class="pp-chip">${fmtDate(d)}<button type="button" data-unpick="${d}">✕</button></span>`).join('');
    return `
      <div class="pp-cal">
        <div class="pp-cal-head">
          <button type="button" class="pp-cal-nav" data-calnav="-1">‹</button>
          <span>${monthLabel(pickerMonth)}</span>
          <button type="button" class="pp-cal-nav" data-calnav="1">›</button>
        </div>
        <div class="pp-cal-grid">${dow.map(d => `<div class="pp-cal-dow">${d}</div>`).join('')}${grid}</div>
        <div class="pp-hint">Tap days to add them. Gold underline = being considered elsewhere. Hatched = already set, can't pick.</div>
        <div class="pp-cal-range">
          <input type="date" id="pp-range-from" />
          <span style="font-size:12px;color:var(--ink-soft);">to</span>
          <input type="date" id="pp-range-to" />
          <button type="button" class="pp-adddate" id="pp-range-fill" style="background:none;border:none;color:var(--pine);font-weight:600;font-size:13px;cursor:pointer;">Fill range</button>
        </div>
        <div class="pp-switch-row" style="margin-top:12px;">
          <button type="button" class="pp-switch ${repeatOn ? 'pp-switch-on' : ''}" data-repeat-toggle><span class="pp-switch-knob"></span></button>
          <span class="pp-switch-label">Make this a repeating series</span>
        </div>
        ${repeatOn ? `
        <div class="pp-cal-range" style="margin-top:8px;">
          <span style="font-size:12px;color:var(--ink-soft);">Repeat picked date(s):</span>
          <select id="pp-repeat-freq">
            <option value="7">Weekly</option>
            <option value="14">Every 2 weeks</option>
            <option value="30">Monthly</option>
          </select>
          <input type="number" id="pp-repeat-count" min="1" max="12" value="4" style="width:54px;" />
          <span style="font-size:12px;color:var(--ink-soft);">times</span>
          <button type="button" class="pp-adddate" id="pp-repeat-apply" style="background:none;border:none;color:var(--pine);font-weight:600;font-size:13px;cursor:pointer;">Apply</button>
        </div>` : ''}
        ${chips ? `<div class="pp-chips">${chips}</div>` : ''}
      </div>`;
  }

  function syncBodyScroll() { document.body.style.overflow = (formOpen || helpOpen || signinOpen || profileOpen || ideaFormOpen || editFormOpen) ? 'hidden' : ''; }
  function modalEnterClass(bar, willBeOpen) {
    if (!willBeOpen) { bar.removeAttribute('data-opened'); return ''; }
    if (bar.getAttribute('data-opened') === 'true') return '';
    bar.setAttribute('data-opened', 'true');
    return ' pp-modal-enter';
  }
  function rerenderForm() {
    const ids = ['pp-f-title', 'pp-f-location', 'pp-f-note'];
    const vals = {};
    ids.forEach(id => { const el = document.getElementById(id); if (el) vals[id] = el.value; });
    render();
    ids.forEach(id => { const el = document.getElementById(id); if (el && vals[id] !== undefined) el.value = vals[id]; });
  }
  function updateFabs() {
    const show = !formOpen && !helpOpen && !signinOpen && !profileOpen && !ideaFormOpen && !editFormOpen;
    document.getElementById('pp-fab').style.display = show ? 'flex' : 'none';
    document.getElementById('pp-help-fab').style.display = (show && !currentUser) ? 'flex' : 'none';
  }

  function renderIdeaCard(idea) {
    return `
      <div class="pp-card pp-idea-card">
        <button class="pp-delx" data-idea-del="${idea.id}" title="Remove this idea">✕</button>
        <button class="pp-editx" data-idea-edit="${idea.id}" title="Edit this idea">⋯</button>
        <h3>${escapeHtml(idea.title)}</h3>
        ${idea.note ? `<div class="pp-note">${escapeHtml(idea.note)}</div>` : ''}
        <button type="button" class="pp-promote-btn" data-idea-promote="${idea.id}">Promote to Planning</button>
      </div>`;
  }

  function renderIdeaForm() {
    const bar = document.getElementById('pp-idea-bar');
    if (!ideaFormOpen) {
      modalEnterClass(bar, false);
      bar.className = ''; bar.innerHTML = ''; bar.onclick = null;
      syncBodyScroll(); updateFabs();
      return;
    }
    syncBodyScroll();
    bar.className = 'pp-modal-overlay' + modalEnterClass(bar, true);
    bar.innerHTML = `
      <div class="pp-modal-sheet">
        <div class="pp-modal-head">
          <h3>New Idea</h3>
          <button class="pp-modal-close" id="pp-idea-close" aria-label="Close">✕</button>
        </div>
        <div class="pp-form">
          <div><label>What's the idea?</label><input type="text" id="pp-idea-title" placeholder="e.g. Cabin trip sometime this winter" maxlength="60" /></div>
          <div><label>Notes (optional)</label><input type="text" id="pp-idea-note" placeholder="Any details worth remembering" maxlength="120" /></div>
          <div class="pp-formbtns">
            <button class="pp-cancel" id="pp-idea-cancel">Cancel</button>
            <button class="pp-submit" id="pp-idea-submit">Save Idea</button>
          </div>
        </div>
      </div>`;
    const closeIdea = () => { ideaFormOpen = false; render(); };
    document.getElementById('pp-idea-close').onclick = closeIdea;
    document.getElementById('pp-idea-cancel').onclick = closeIdea;
    bar.onclick = (e) => { if (e.target === bar) closeIdea(); };
    document.getElementById('pp-idea-submit').onclick = async () => {
      const title = document.getElementById('pp-idea-title').value.trim();
      if (!title) { setStatus('Give your idea a name.'); return; }
      const note = document.getElementById('pp-idea-note').value.trim();
      const idea = { id: 'idea' + Date.now() + Math.random().toString(36).slice(2, 6), title, note, createdAt: Date.now() };
      myProfile.ideas = myProfile.ideas || [];
      myProfile.ideas.push(idea);
      try { await setDoc(doc(db, 'users', currentUser.uid), myProfile); }
      catch (e) { setStatus('Could not save — try again.'); }
      ideaFormOpen = false;
      render();
    };
    updateFabs();
  }

  function renderEditForm() {
    const bar = document.getElementById('pp-edit-bar');
    if (!editFormOpen) {
      modalEnterClass(bar, false);
      bar.className = ''; bar.innerHTML = ''; bar.onclick = null;
      syncBodyScroll(); updateFabs();
      return;
    }
    let title = '', note = '', location = '', heading = 'Edit', locationOnly = false, showLocation = false;
    if (editTargetType === 'event') {
      const ev = data.events.find(e => e.id === editTargetId);
      if (!ev) { editFormOpen = false; render(); return; }
      title = ev.title; note = ev.note || ''; location = ev.location || '';
      heading = 'Edit Gathering'; showLocation = true;
    } else if (editTargetType === 'idea') {
      const idea = (myProfile.ideas || []).find(i => i.id === editTargetId);
      if (!idea) { editFormOpen = false; render(); return; }
      title = idea.title; note = idea.note || '';
      heading = 'Edit Idea';
    } else if (editTargetType === 'addlocation') {
      const ev = data.events.find(e => e.id === editTargetId);
      if (!ev) { editFormOpen = false; render(); return; }
      heading = 'Add Location'; locationOnly = true;
    }
    syncBodyScroll();
    bar.className = 'pp-modal-overlay' + modalEnterClass(bar, true);
    bar.innerHTML = `
      <div class="pp-modal-sheet">
        <div class="pp-modal-head">
          <h3>${heading}</h3>
          <button class="pp-modal-close" id="pp-edit-close" aria-label="Close">✕</button>
        </div>
        <div class="pp-form">
          ${!locationOnly ? `
          <div><label>Title</label><input type="text" id="pp-edit-title" value="${escapeHtml(title)}" maxlength="60" /></div>
          <div><label>Notes (optional)</label><input type="text" id="pp-edit-note" value="${escapeHtml(note)}" maxlength="120" /></div>` : ''}
          ${showLocation || locationOnly ? `
          <div><label>Location${locationOnly ? '' : ' (optional)'}</label><input type="text" id="pp-edit-location" value="${escapeHtml(location)}" placeholder="e.g. our place, the park pavilion" maxlength="80" /></div>` : ''}
          <div class="pp-formbtns">
            <button class="pp-cancel" id="pp-edit-cancel">Cancel</button>
            <button class="pp-submit" id="pp-edit-save">Save</button>
          </div>
        </div>
      </div>`;
    const closeEdit = () => { editFormOpen = false; render(); };
    document.getElementById('pp-edit-close').onclick = closeEdit;
    document.getElementById('pp-edit-cancel').onclick = closeEdit;
    bar.onclick = (e) => { if (e.target === bar) closeEdit(); };
    document.getElementById('pp-edit-save').onclick = async () => {
      if (editTargetType === 'event') {
        const ev = data.events.find(e => e.id === editTargetId);
        if (!ev) return;
        const newTitle = document.getElementById('pp-edit-title').value.trim();
        if (!newTitle) { setStatus('Give it a name.'); return; }
        ev.title = newTitle;
        ev.note = document.getElementById('pp-edit-note').value.trim();
        const newLoc = document.getElementById('pp-edit-location').value.trim();
        if (newLoc !== ev.location) ev.locationGeo = null;
        ev.location = newLoc;
        await save();
      } else if (editTargetType === 'idea') {
        const idea = (myProfile.ideas || []).find(i => i.id === editTargetId);
        if (!idea) return;
        const newTitle = document.getElementById('pp-edit-title').value.trim();
        if (!newTitle) { setStatus('Give it a name.'); return; }
        idea.title = newTitle;
        idea.note = document.getElementById('pp-edit-note').value.trim();
        try { await setDoc(doc(db, 'users', currentUser.uid), myProfile); }
        catch (e) { setStatus('Could not save — try again.'); }
      } else if (editTargetType === 'addlocation') {
        const ev = data.events.find(e => e.id === editTargetId);
        if (!ev) return;
        const newLoc = document.getElementById('pp-edit-location').value.trim();
        if (!newLoc) { setStatus('Enter a location.'); return; }
        ev.location = newLoc;
        await save();
      }
      editFormOpen = false;
      render();
    };
    updateFabs();
  }

  function renderForm() {
    const bar = document.getElementById('pp-addbar');
    if (!formOpen) {
      modalEnterClass(bar, false);
      bar.className = '';
      bar.innerHTML = '';
      bar.onclick = null;
      syncBodyScroll(); updateFabs();
      return;
    }
    syncBodyScroll();
    bar.className = 'pp-modal-overlay' + modalEnterClass(bar, true);
    const defGuests = myProfile ? myProfile.prefs.defaultGuests !== false : true;
    const defBring = myProfile ? myProfile.prefs.defaultBring !== false : true;
    const addr = myProfile && myProfile.address;
    const defAddress = addr ? [addr.street, addr.label].filter(Boolean).join(', ') : '';
    formDefaultAddress = defAddress;
    formDefaultAddressGeo = (addr && typeof addr.lat === 'number') ? { lat: addr.lat, lon: addr.lon } : null;
    bar.innerHTML = `
      <div class="pp-modal-sheet">
        <div class="pp-modal-head">
          <h3>Suggest a Gathering</h3>
          <button class="pp-modal-close" id="pp-modal-close" aria-label="Close">✕</button>
        </div>
        <div class="pp-form">
          <div><label>What's the idea?</label><input type="text" id="pp-f-title" value="${escapeHtml(prefillTitle)}" placeholder="e.g. Cookout at the lake" maxlength="60" /></div>
          <div><label>Location (optional)</label><input type="text" id="pp-f-location" value="${escapeHtml(defAddress)}" placeholder="e.g. our place, the park pavilion" maxlength="80" /></div>
          <div><label>Details (optional)</label><input type="text" id="pp-f-note" value="${escapeHtml(prefillNote)}" placeholder="e.g. bring a side, starts at 5" maxlength="80" /></div>
          <div><label>Possible dates</label>${renderDatePicker()}</div>
          <div style="display:flex;gap:20px;flex-wrap:wrap;">
            <div class="pp-switch-row">
              <button type="button" class="pp-switch ${defGuests ? 'pp-switch-on' : ''}" data-formswitch="pp-f-guests"><span class="pp-switch-knob"></span></button>
              <span class="pp-switch-label">Track extra guests</span>
              <input type="checkbox" id="pp-f-guests" ${defGuests ? 'checked' : ''} style="display:none;">
            </div>
            <div class="pp-switch-row">
              <button type="button" class="pp-switch ${defBring ? 'pp-switch-on' : ''}" data-formswitch="pp-f-bring"><span class="pp-switch-knob"></span></button>
              <span class="pp-switch-label">Let people sign up to bring things</span>
              <input type="checkbox" id="pp-f-bring" ${defBring ? 'checked' : ''} style="display:none;">
            </div>
          </div>
          <div>
            <label>What to bring (optional)</label>
            <div class="pp-bring-add">
              <input type="text" id="pp-f-bring-item" placeholder="e.g. Chips, Drinks, Chairs" maxlength="40" />
              <button type="button" id="pp-f-bring-additem">Add</button>
            </div>
            ${draftBringItems.length ? `<div class="pp-chips">${draftBringItems.map((label, i) => `<span class="pp-chip">${escapeHtml(label)}<button type="button" data-unpick-bring="${i}">✕</button></span>`).join('')}</div>` : ''}
          </div>
          <div class="pp-formbtns">
            <button class="pp-cancel" id="pp-f-cancel">Cancel</button>
            <button class="pp-submit" id="pp-f-submit">Add to the list</button>
          </div>
        </div>
      </div>`;
    const closeForm = () => { formOpen = false; render(); };
    document.getElementById('pp-modal-close').onclick = closeForm;
    document.getElementById('pp-f-cancel').onclick = closeForm;
    document.getElementById('pp-f-submit').onclick = submitEvent;
    bar.onclick = (e) => { if (e.target === bar) closeForm(); };
    const addBringBtn = document.getElementById('pp-f-bring-additem');
    if (addBringBtn) addBringBtn.onclick = () => {
      const inp = document.getElementById('pp-f-bring-item');
      const val = inp.value.trim();
      if (!val) return;
      draftBringItems.push(val);
      rerenderForm();
    };
    document.querySelectorAll('[data-unpick-bring]').forEach(btn => {
      btn.onclick = () => { draftBringItems.splice(parseInt(btn.dataset.unpickBring), 1); rerenderForm(); };
    });
    document.querySelectorAll('[data-formswitch]').forEach(btn => {
      btn.onclick = () => {
        const cb = document.getElementById(btn.dataset.formswitch);
        cb.checked = !cb.checked;
        btn.classList.toggle('pp-switch-on', cb.checked);
      };
    });
    updateFabs();
  }

  function renderHelp() {
    const bar = document.getElementById('pp-help-bar');
    if (!helpOpen) {
      modalEnterClass(bar, false);
      bar.className = '';
      bar.innerHTML = '';
      bar.onclick = null;
      syncBodyScroll(); updateFabs();
      return;
    }
    syncBodyScroll();
    bar.className = 'pp-modal-overlay' + modalEnterClass(bar, true);
    bar.innerHTML = `
      <div class="pp-modal-sheet">
        <div class="pp-modal-head">
          <h3>How Porch Plans works</h3>
          <button class="pp-modal-close" id="pp-help-close" aria-label="Close">✕</button>
        </div>
        <div class="pp-help-section">
          <h4>Suggesting a gathering</h4>
          <p>Tap the green + button, name the idea, and pick dates on the calendar — tap single days, fill a whole stretch with the range option, or generate a repeating series (weekly, every 2 weeks, or monthly).</p>
        </div>
        <div class="pp-help-section">
          <h4>Location, guests &amp; what to bring</h4>

  function popOnce(selector) {
    const el = document.querySelector(selector);

  function wireBadgePickerHandlers() {

        popOnce(`[data-icon-pick="${draftBadgeIcon}"]`);

        draftBadgeColor = btn.dataset.colorPick; draftBadgeShade = 4;

        popOnce(`[data-color-pick="${draftBadgeColor}"]`);
      };
    });

      btn.onclick = () => {
        draftBadgeShade = parseInt(btn.dataset.shadePick);

        popOnce(`[data-shade-pick="${draftBadgeShade}"]`);
      };

  function wireThemePickerHandlers() {

    document.querySelectorAll('[data-season-pick]').forEach(btn => {
      btn.onclick = () => { draftThemeSeason = btn.dataset.seasonPick; updateThemeSection(); };

  function renderProfile() {
    const bar = document.getElementById('pp-profile-bar');
    if (!profileOpen || !myProfile) {

          <h3>${isFirstRun ? 'Welcome to My Porch!' : 'My Porch'}</h3>

          <p class="pp-hint">The city powers weather and auto-fills new gatherings. Add a street address too, so anyone coming from out of town knows exactly where to go.</p>

            <span class="pp-switch-label">New gatherings track guests by default</span>
          </div>
          <div class="pp-switch-row">
            <button type="button" class="pp-switch ${p.prefs.defaultBring !== false ? 'pp-switch-on' : ''}" id="pp-pref-bring"><span class="pp-switch-knob"></span></button>
            <span class="pp-switch-label">New gatherings have a bring-list by default</span>
          </div>
        </div>

        <div class="pp-profile-card">
          <div id="pp-badge-section">${renderBadgePickerHtml()}</div>
          <div class="pp-profile-divider"></div>
          <div id="pp-theme-section">${renderThemePickerHtml()}</div>

        <div class="pp-profile-card">
          <h4>Learn</h4>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="pp-help-menu-btn" id="pp-profile-help" style="flex:1;min-width:150px;margin-bottom:0;"><span class="pp-help-menu-icon">?</span> How Porch Plans works</button>
            <button type="button" class="pp-help-menu-btn" id="pp-profile-tour" style="flex:1;min-width:150px;margin-bottom:0;"><span class="pp-help-menu-icon">↻</span> Replay the tour</button>

          <button class="pp-submit" id="pp-profile-save" style="width:100%;">${isFirstRun ? 'Save &amp; Continue' : 'Save'}</button>

            : '<button class="pp-cancel" id="pp-profile-signout" style="width:100%;margin-top:8px;">Sign out</button>'}
        </div>
      </div>`;
    if (!isFirstRun) {
      const closeProfile = () => { profileOpen = false; render(); };
      document.getElementById('pp-profile-close').onclick = closeProfile;
      bar.onclick = (e) => { if (e.target === bar) closeProfile(); };
    } else {
      bar.onclick = null;

    document.getElementById('pp-profile-help').onclick = () => {
      profileOpen = false;
      helpOpen = true;
      render();

    document.getElementById('pp-profile-tour').onclick = () => {
      setStatus('The guided tour is coming soon!');

    wireBadgePickerHandlers();
    wireThemePickerHandlers();
    ['pp-pref-guests', 'pp-pref-bring'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onclick = () => el.classList.toggle('pp-switch-on');
    });
    const addrInput = document.getElementById('pp-profile-address');
    if (addrInput) {
      addrInput.oninput = (e) => {
        draftAddressLabel = e.target.value;
        draftAddressGeo = null;
        searchAddressSuggestions(draftAddressLabel);
      };
      addrInput.onkeydown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          clearTimeout(addressSearchTimer);
          runAddressSearch(addrInput.value);
        }
      };
    }
    const streetInput = document.getElementById('pp-profile-street');
    if (streetInput) streetInput.oninput = (e) => { draftStreetAddress = e.target.value; };
    updateAddressSuggestionsUI();
    const fnInput = document.getElementById('pp-profile-firstname');
    const skipBtn = document.getElementById('pp-profile-skip');
    if (skipBtn) {
      const syncSkip = () => { skipBtn.disabled = !fnInput.value.trim(); };
      fnInput.addEventListener('input', syncSkip);
      syncSkip();
      skipBtn.onclick = async () => {
        const firstName = fnInput.value.trim();
        if (!firstName) return;
        const oldLabel = identityLabel(p);
        myProfile = { ...p, firstName, setupComplete: true };
        const newLabel = identityLabel(myProfile);
        myName = newLabel;
        localStorage.setItem(SAVED_NAME_KEY, myName);
        data.badges = data.badges || {};
        if (oldLabel && oldLabel !== newLabel && data.badges[oldLabel]) {
          data.badges[newLabel] = data.badges[oldLabel];
          delete data.badges[oldLabel];
        }
        try { await setDoc(doc(db, 'users', currentUser.uid), myProfile); }
        catch (e) { setStatus('Could not save — try again.'); }
        try { await save(); } catch (e) {}
        profileOpen = false;
        render();
      };
    }
    document.getElementById('pp-profile-save').onclick = async () => {
      const firstName = document.getElementById('pp-profile-firstname').value.trim();
      const errEl = document.getElementById('pp-name-error');
      if (!firstName) { if (errEl) errEl.style.display = 'block'; return; }

      const lastInitial = document.getElementById('pp-profile-lastinitial').value.trim().slice(0, 1);
      const streetVal = document.getElementById('pp-profile-street').value.trim();
      const address = draftAddressGeo
        ? { label: draftAddressLabel.trim(), lat: draftAddressGeo.lat, lon: draftAddressGeo.lon, street: streetVal }
        : (draftAddressLabel.trim() ? { label: draftAddressLabel.trim(), lat: null, lon: null, street: streetVal } : null);
      const defaultGuests = document.getElementById('pp-pref-guests').classList.contains('pp-switch-on');
      const defaultBring = document.getElementById('pp-pref-bring').classList.contains('pp-switch-on');
      const badge = (draftBadgeIcon && draftBadgeColor)
        ? { icon: draftBadgeIcon, color: draftBadgeColor, shade: draftBadgeShade, hex: COLOR_RAMPS[draftBadgeColor][draftBadgeShade] }
        : null;
      const theme = { mode: draftThemeMode, season: draftThemeSeason, monochromeFamily: draftThemeMonoFamily, darkMode: draftThemeDark };
      const oldLabel = identityLabel(p);
      myProfile = { ...p, firstName, lastInitial, address, badge, prefs: { defaultGuests, defaultBring }, theme, setupComplete: true };
      const newLabel = identityLabel(myProfile);
      myName = newLabel;
      localStorage.setItem(SAVED_NAME_KEY, myName);
      data.badges = data.badges || {};
      if (oldLabel && oldLabel !== newLabel && data.badges[oldLabel]) {
        data.badges[newLabel] = data.badges[oldLabel];
        delete data.badges[oldLabel];
      }
      if (badge) { data.badges[newLabel] = badge; } else { delete data.badges[newLabel]; }
      try { await setDoc(doc(db, 'users', currentUser.uid), myProfile); }
      catch (e) { setStatus('Could not save your private settings — try again.'); }
      try { await save(); }
      catch (e) { setStatus('Could not update your badge for others — try again.'); }
      profileOpen = false;
      render();
    };

      document.getElementById('pp-profile-signout').onclick = async () => {

        cachedGreeting = null;
        profileOpen = false;
        render();

  document.getElementById('pp-avatar-btn').addEventListener('click', () => {
